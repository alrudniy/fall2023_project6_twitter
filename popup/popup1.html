<!DOCTYPE html>
<html>
<head>
    <title>Main Popup</title>
    <link rel="stylesheet" type="text/css" href="popup.css">

    <style>
        .button {
            background-color: black;
            border: none;
            color: white;
            width: 150px; /* Set the width and height to the same value for a perfect circle */
            height: 150px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 50%; /* Make the button round */
        }

        .button1 {
            font-size: 30px;
        }

        .footer{
            width: 900px;
            height: 30px;
            position: middle;
            bottom: 0;
        }
        body {
            background-color: #92a1ff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        .popup {
            text-align: center;
        }
    </style>
</head>

<body style="width: 300px; height: 400px;">
    <div class="popup">
        <h1>CSAMStopper</h1>
        <p>Keep Your Children Safe Online!</p>
        <button id="toggleButton" class="button button1">TURN ON</button> 
        <a href="submit" formaction="https://www.google.com"><button class = "footer button2">Enter Auth Code</button></a>
    </div>
</body>
</html>
